<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Administrador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #18191a;
            --bg-secondary: #242526;
            --bg-card: #3a3b3c;
            --bg-input: #3a3b3c;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --text-muted: #8a8d91;
            --border-color: #3e4042;
            --shadow-color: rgba(0,0,0,0.3);
            --gradient-start: #0077ff;
            --gradient-end: #7b2ffc;
            --danger: #dc3545;
            --transition: 0.3s ease;
        }
        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f0f2f5;
            --text-primary: #050505;
            --text-secondary: #65676b;
            --text-muted: #8a8d91;
            --border-color: #ced0d4;
            --shadow-color: rgba(0,0,0,0.1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background var(--transition), color var(--transition);
        }
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 999;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 1.1rem;
            transition: var(--transition);
        }
        .theme-toggle:hover { transform: scale(1.1); border-color: var(--gradient-start); }

        .login-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 400px;
            width: 100%;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px var(--shadow-color);
        }
        .login-card .logo-icon {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 1.8rem;
            margin: 0 auto 16px;
        }
        .login-card h2 { text-align:center; font-size:1.5rem; }
        .login-card p {
            text-align:center; color:var(--text-secondary);
            margin-bottom:24px; font-size:0.95rem;
        }
        .form-group { margin-bottom:16px; }
        .form-group label {
            display:block; color:var(--text-secondary);
            font-weight:500; font-size:0.85rem; margin-bottom:4px;
        }
        .form-group input {
            width:100%; padding:12px 16px;
            background:var(--bg-input); border:1px solid var(--border-color);
            border-radius:10px; color:var(--text-primary);
            font-size:1rem; transition:var(--transition); outline:none;
        }
        .form-group input:focus { border-color:var(--gradient-start); }
        .login-btn {
            width:100%; padding:14px; border-radius:10px; border:none;
            background:linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color:#fff; font-weight:700; font-size:1rem;
            cursor:pointer; transition:var(--transition);
        }
        .login-btn:hover { transform:translateY(-2px); box-shadow:0 4px 20px rgba(0,119,255,0.3); }
        .login-error {
            color:var(--danger); text-align:center;
            margin-top:12px; font-size:0.9rem; display:none;
        }
        .login-back {
            display:block; text-align:center; margin-top:16px;
            color:var(--text-muted); font-size:0.9rem;
            transition:var(--transition);
        }
        .login-back:hover { color:var(--text-primary); }

        @media (max-width:480px) {
            .login-card { padding:32px 24px; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>

    <div class="login-card">
        <div class="logo-icon">M</div>
        <h2>Painel Administrativo</h2>
        <p>Faça login para gerenciar seu portfólio</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="loginUser" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Entrar</button>
            <div id="loginError" class="login-error">Credenciais inválidas. Tente novamente.</div>
        </form>
        <a href="../index.html" class="login-back"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
    </div>

    <script>
        // Theme
        const themeToggle = document.getElementById('themeToggle');
        let currentTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);
        themeToggle.addEventListener('click', () => {
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            currentTheme = newTheme;
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });
        function updateThemeIcon(theme) {
            const icon = themeToggle.querySelector('i');
            icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if (user === 'admin' && pass === 'admin123') {
                sessionStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        // Se já estiver logado, redirecionar para dashboard
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
